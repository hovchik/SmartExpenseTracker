<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic (1024x500). Keep text inside the centre-safe
       area: Play may crop edges and overlay a play button in the middle on some
       surfaces, so the mark sits left and the wordmark right. -->
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="fglow" cx="820" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="81" cy="22" r="65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  
    <linearGradient id="rib" x1="36" y1="0" x2="78" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="mint" x1="57" y1="59" x2="75" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  
  </defs>
  <rect width="1024" height="500" fill="url(#fbg)"/>
  <rect width="1024" height="500" fill="url(#fglow)"/>
  <!-- background flow lines echoing the ribbons of the mark -->
  <path d="M-20,410 C200,410 300,330 520,330 C700,330 800,380 1044,380" fill="none" stroke="url(#wave)" stroke-width="28" stroke-linecap="round"/>
  <path d="M-20,460 C220,460 330,400 540,400 C720,400 820,440 1044,440" fill="none" stroke="url(#wave)" stroke-width="16" stroke-linecap="round"/>
  <!-- app icon tile -->
  <g transform="translate(96 110)">
    <rect x="0" y="0" width="280" height="280" rx="66" fill="#000000" opacity="0.18" transform="translate(0 10)"/>
    <svg x="0" y="0" width="280" height="280" viewBox="14 14 80 80">
      <clipPath id="tile"><rect x="14" y="14" width="80" height="80" rx="19"/></clipPath>
      <g clip-path="url(#tile)">
  
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#glow)"/>

  
  
  <g transform="translate(54 54) scale(0.84) translate(-55.5 -53.5)">
  <path d="M36,38 L36,75" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M36,38 C46,38 50,32 60,32 C66,32 69,35 72,38" fill="none" stroke="url(#rib)" stroke-width="9" stroke-linecap="round"/>
  <path d="M36,55 C43,55 46,50 53,50 C57,50 59,52 61,54" fill="none" stroke="url(#rib)" stroke-width="9" stroke-linecap="round"/>
  <path d="M66,59 C66.9,65.6 68.4,67.1 75,68 C68.4,68.9 66.9,70.4 66,77 C65.1,70.4 63.6,68.9 57,68 C63.6,67.1 65.1,65.6 66,59 Z" fill="url(#mint)"/>
  </g>
</g>
    </svg>
  </g>
  <!-- wordmark -->
  <text x="440" y="236" font-family="Inter, 'Inter Display', Roboto, 'DejaVu Sans', sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-2">FlowSense</text>
  <text x="444" y="298" font-family="Inter, Roboto, 'DejaVu Sans', sans-serif" font-size="31" font-weight="500" fill="#E0E7FF">Track every expense automatically.</text>
  <g transform="translate(444 334)">
    <rect width="264" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.12"/>
    <path transform="translate(14 7) scale(0.95)" d="M17,2 C17.9,8.6 19.4,10.1 26,11 C19.4,11.9 17.9,13.4 17,20 C16.1,13.4 14.6,11.9 8,11 C14.6,10.1 16.1,8.6 17,2 Z" fill="#6EE7B7"/>
    <text x="48" y="31" font-family="Inter, Roboto, 'DejaVu Sans', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">AI-powered insights</text>
  </g>
</svg>
