<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- FlowSense app icon (composited background + foreground). Source of truth
       for the Play Store icon and store-listing preview. -->
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.5" stop-color="#0F3B39"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

  <path d="M27,79 C47,79 50,46 79,33"
        fill="none" stroke="#22D3EE" stroke-opacity="0.16"
        stroke-width="22" stroke-linecap="round"/>

  <path d="M27,79 C47,79 50,46 79,33"
        fill="none" stroke="url(#flow)"
        stroke-width="10" stroke-linecap="round"/>

  <path d="M64,31 L81,29 L79,46"
        fill="none" stroke="url(#flow)"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M84,20 C84,25 85,26 90,26 C85,26 84,27 84,32 C84,27 83,26 78,26 C83,26 84,25 84,20 Z"
        fill="#E0F7FA"/>
</svg>
